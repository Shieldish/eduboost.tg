# .gitlab-ci.yml — Pipeline CI/CD GTE Frontend
#
# Stages :
#   test  → lint + tests unitaires composants/hooks
#   build → build Next.js Docker + push registry

stages:
  - test
  - build

variables:
  NODE_ENV: test
  IMAGE: registry.gitlab.com/it-plex/gte-frontend
  DOCKER_TLS_CERTDIR: "/certs"

# Cache npm entre jobs
.node-cache: &node-cache
  cache:
    key: "npm-$CI_COMMIT_REF_SLUG"
    paths:
      - node_modules/
      - .npm/

# ═══════════════════════════════════════════════════════════════════════════════
# STAGE : test
# ═══════════════════════════════════════════════════════════════════════════════

lint:
  stage: test
  image: node:20-alpine
  <<: *node-cache
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run lint
  only:
    - main
    - merge_requests

unit-tests:
  stage: test
  image: node:20-alpine
  <<: *node-cache
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run test:coverage
  coverage: '/Lines\s*:\s*(\d+\.?\d*)%/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
      junit: test-results.xml
    paths:
      - coverage/
    expire_in: 1 week
  only:
    - main
    - merge_requests

typecheck:
  stage: test
  image: node:20-alpine
  <<: *node-cache
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npx tsc --noEmit
  only:
    - main
    - merge_requests

# ═══════════════════════════════════════════════════════════════════════════════
# STAGE : build
# ═══════════════════════════════════════════════════════════════════════════════

build-and-push:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build
        --build-arg NEXT_PUBLIC_API_URL=""
        -t "$IMAGE:$CI_COMMIT_SHORT_SHA"
        -t "$IMAGE:latest"
        .
    - docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$IMAGE:latest"
  only:
    - main
  except:
    changes:
      - "*.md"
      - "tests/**"
      - ".gitignore"
  needs:
    - lint
    - unit-tests
    - typecheck
